<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, orderBy, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWjkNA5Bz80oJPLfRVJ-Ez4psCL7mP89U",
            authDomain: "classroom-management-widget.firebaseapp.com",
            projectId: "classroom-management-widget",
            storageBucket: "classroom-management-widget.firebasestorage.app",
            messagingSenderId: "97216302017",
            appId: "1:97216302017:web:67e49d5be0f015dcd47d40"
        };

        // Global State
        let app, auth, db, provider;
        let currentUser = null;
        let currentClassId = null;
        let classData = null; 
        let attendanceBuffer = {};
        let submissionBuffer = {};
        let historySessions = {}; // Stores history locally for quick editing

        function initFirebase() {
            const hasKeys = Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey;
            if (!hasKeys) {
                document.getElementById('screen-setup').classList.remove('hidden');
                document.getElementById('screen-login').classList.add('hidden');
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                provider = new GoogleAuthProvider();
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        if(document.getElementById('user-name')) document.getElementById('user-name').innerText = user.displayName;
                        if(document.getElementById('user-avatar')) document.getElementById('user-avatar').src = user.photoURL;
                        window.loadDashboard();
                    } else {
                        currentUser = null;
                        showScreen('login');
                    }
                });
            } catch (e) {
                console.error("Firebase initialization failed:", e);
            }
        }

        window.login = async () => {
            if (!auth) return alert("Firebase not connected.");
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Login Failed: " + error.message);
            }
        };

        window.logout = () => signOut(auth);

        window.loadDashboard = async () => {
            if (!currentUser) return;
            showScreen('dashboard');
            const list = document.getElementById('class-grid');
            list.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>';
            
            try {
                const q = query(collection(db, `users/${currentUser.uid}/classes`));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    list.innerHTML = `<div class="col-span-full text-center py-10"><h3 class="text-slate-600 font-medium">No classes yet</h3></div>`;
                } else {
                    const classes = [];
                    snapshot.forEach(doc => classes.push({ id: doc.id, ...doc.data() }));
                    classes.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
                    list.innerHTML = '';
                    classes.forEach(cls => {
                        list.innerHTML += `
                            <div onclick="enterClass('${cls.id}')" class="group relative bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-blue-300 hover:shadow-md cursor-pointer transition-all">
                                <button onclick="deleteClass('${cls.id}', event)" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-2" title="Delete Class">
                                    <i class="fas fa-trash"></i>
                                </button>
                                <h3 class="font-bold text-lg text-slate-800 truncate pr-8">${cls.name}</h3>
                                <p class="text-xs text-slate-400 mt-1">${cls.students ? cls.students.length : 0} Students</p>
                            </div>`;
                    });
                }
            } catch (e) {
                list.innerHTML = `<p class="text-red-500 text-center py-10">Error loading classes.</p>`;
            }
        };

        window.createClass = async () => {
            const name = prompt("Enter Class Name:");
            if (!name) return;
            try {
                await addDoc(collection(db, `users/${currentUser.uid}/classes`), {
                    name: name, students: [], layout: {}, createdAt: new Date()
                });
                loadDashboard();
            } catch (e) { alert("Error: " + e.message); }
        };

        // NEW: Delete class function
        window.deleteClass = async (classId, event) => {
            event.stopPropagation(); // Prevents you from entering the class when clicking the trash can
            if(!confirm("Are you sure you want to delete this class? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, `users/${currentUser.uid}/classes/${classId}`));
                loadDashboard();
            } catch(e) {
                alert("Error deleting class: " + e.message);
            }
        };

        window.enterClass = async (classId) => {
            currentClassId = classId;
            showScreen('app-layout');
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                const docSnap = await getDoc(doc(db, `users/${currentUser.uid}/classes/${classId}`));
                if (docSnap.exists()) {
                    classData = docSnap.data();
                    attendanceBuffer = {}; submissionBuffer = {};
                    document.getElementById('class-name-display').innerText = classData.name;
                    updateStudentListUI(); renderGrid(); switchTab('layout');
                }
            } catch (e) { console.error(e); }
            document.getElementById('loading-overlay').classList.add('hidden');
        };

        window.saveClassData = async () => {
            if (!currentClassId) return;
            const btn = document.getElementById('btn-save-layout');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            try {
                await updateDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}`), {
                    students: classData.students, layout: classData.layout
                });
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => btn.innerHTML = '<i class="fas fa-save"></i> Save Layout', 2000);
            } catch (e) { btn.innerHTML = '<i class="fas fa-save"></i> Save Layout'; }
        };

        window.saveSpecificSession = async (type) => {
            if (!currentClassId) return;
            
            const label = prompt(`Enter a label for this ${type} record\n(e.g., 'Week 1', 'Math Homework'):`);
            if (label === null) return; 

            const btnId = type === 'attendance' ? 'btn-save-att' : 'btn-save-sub';
            const btn = document.getElementById(btnId);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const timestamp = new Date();
            const sessionData = {
                date: timestamp.toLocaleString(), 
                timestamp: timestamp,
                type: type,
                label: label || (type === 'attendance' ? 'Attendance' : 'Submission'),
                records: classData.students.map(s => ({
                    id: s.id, 
                    name: s.name, 
                    status: type === 'attendance' ? (attendanceBuffer[s.id] || false) : (submissionBuffer[s.id] || false)
                }))
            };

            try {
                await addDoc(collection(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions`), sessionData);
                
                if (type === 'attendance') attendanceBuffer = {};
                if (type === 'submission') submissionBuffer = {};
                renderGrid();
                
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    switchTab('history');
                }, 1000);
            } catch (e) { 
                btn.innerHTML = originalHTML;
                alert("Error saving session: " + e.message); 
            }
        };

        window.deleteSession = async (sessId) => {
            if(!confirm("Are you sure you want to delete this record? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions/${sessId}`));
                loadHistory(); 
            } catch (e) {
                alert("Error deleting record: " + e.message);
            }
        };

        window.loadHistory = async () => {
            const container = document.getElementById('history-list');
            container.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>';
            try {
                const snapshot = await getDocs(query(collection(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions`)));
                if (snapshot.empty) { container.innerHTML = '<div class="text-center py-8 text-slate-400">No records found.</div>'; return; }
                const sessions = [];
                snapshot.forEach(doc => {
                    let data = doc.data();
                    // Normalize the legacy records to use "status"
                    data.records = data.records.map(r => ({
                        ...r, 
                        status: r.status !== undefined ? r.status : (data.type === 'submission' ? r.submitted : r.present)
                    }));
                    sessions.push({ id: doc.id, ...data });
                });
                sessions.sort((a, b) => b.timestamp - a.timestamp);
                
                // Store in global object for easy editing
                historySessions = {}; 
                sessions.forEach(s => historySessions[s.id] = s);
                
                let html = '<div class="space-y-4">';
                sessions.forEach(sess => {
                    const sid = sess.id;
                    const activeCount = sess.records.filter(r => r.status).length;
                    const totalCount = sess.records.length;
                    
                    const isAtt = sess.type !== 'submission'; 
                    const typeLabel = isAtt ? 'Attendance' : 'Submission';
                    const countLabel = isAtt ? 'Present' : 'Submitted';
                    const colorClass = isAtt ? 'text-blue-600 bg-blue-50 border-blue-200' : 'text-green-600 bg-green-50 border-green-200';
                    const dotColorTrue = isAtt ? 'bg-blue-400' : 'bg-green-400';
                    const dotColorFalse = 'bg-red-400';
                    const userLabel = sess.label || typeLabel; 

                    html += `
                        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm transition-all duration-300">
                            <div class="flex justify-between items-start">
                                <div class="overflow-hidden">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-[9px] font-bold px-2 py-0.5 rounded uppercase border ${colorClass}">${typeLabel}</span>
                                        <h4 class="font-bold text-slate-700 text-sm truncate" title="${userLabel}">${userLabel}</h4>
                                    </div>
                                    <p class="text-[10px] text-slate-400 font-medium mb-1">${sess.date}</p>
                                    <p id="hist-count-${sid}" class="text-[10px] text-slate-500 font-bold uppercase">${countLabel}: ${activeCount}/${totalCount}</p>
                                </div>
                                <div class="flex items-center gap-2 pl-2">
                                    <button onclick="toggleSessionDetails('${sid}')" class="text-slate-600 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center hover:bg-slate-100 transition-colors">
                                        <span id="btn-text-${sid}">Details</span> <i id="icon-${sid}" class="fas fa-chevron-down ml-2 transition-transform duration-300"></i>
                                    </button>
                                    <button onclick="deleteSession('${sid}')" class="text-slate-300 hover:text-red-500 transition-colors p-1.5" title="Delete record">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div id="details-${sid}" class="text-xs text-slate-500 max-h-0 overflow-hidden opacity-0 transition-all duration-500 ease-in-out">
                                <p class="text-[10px] text-slate-400 mt-4 mb-2"><i class="fas fa-info-circle mr-1"></i> Click a student to edit their status.</p>
                                <div class="border-t border-slate-100 pt-3 grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    ${sess.records.map(r => `
                                        <div onclick="toggleHistoryStatus('${sid}', '${r.id}')" class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-100 cursor-pointer hover:border-blue-300 transition-colors">
                                            <div id="hist-dot-${sid}-${r.id}" class="w-2 h-2 rounded-full ${r.status ? dotColorTrue : dotColorFalse}"></div>
                                            <span id="hist-name-${sid}-${r.id}" class="truncate ${!r.status ? 'text-red-500 font-medium' : 'text-slate-600'}">${r.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div id="hist-save-container-${sid}" class="hidden mt-4 pt-3 border-t border-slate-100 flex justify-end">
                                    <button id="hist-save-btn-${sid}" onclick="saveHistoryEdits('${sid}')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors flex items-center gap-2">
                                        <i class="fas fa-save"></i> Save Changes
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
                container.innerHTML = html + '</div>';
            } catch (e) { container.innerHTML = '<p class="text-red-500">Error loading history.</p>'; }
        };

        // NEW: Toggle individual student status inside history edit
        window.toggleHistoryStatus = (sessId, studentId) => {
            const sess = historySessions[sessId];
            const student = sess.records.find(r => r.id === studentId);
            student.status = !student.status; // Flip status in memory

            const dot = document.getElementById(`hist-dot-${sessId}-${studentId}`);
            const text = document.getElementById(`hist-name-${sessId}-${studentId}`);
            
            const isAtt = sess.type !== 'submission';
            const dotColorTrue = isAtt ? 'bg-blue-400' : 'bg-green-400';

            // Visually update the UI instantly
            if(student.status) {
                dot.className = `w-2 h-2 rounded-full ${dotColorTrue}`;
                text.className = `truncate text-slate-600`;
            } else {
                dot.className = `w-2 h-2 rounded-full bg-red-400`;
                text.className = `truncate text-red-500 font-medium`;
            }

            // Show the "Save Changes" button for this session
            document.getElementById(`hist-save-container-${sessId}`).classList.remove('hidden');
        };

        // NEW: Push history edits back to database
        window.saveHistoryEdits = async (sessId) => {
            const btn = document.getElementById(`hist-save-btn-${sessId}`);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            try {
                const sess = historySessions[sessId];
                await updateDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions/${sessId}`), {
                    records: sess.records
                });
                
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => {
                    document.getElementById(`hist-save-container-${sessId}`).classList.add('hidden');
                    btn.innerHTML = originalHTML;
                    loadHistory(); // Reloads history to update the count (X/Y) at the top of the card
                }, 1000);
            } catch(e) {
                alert("Error saving edits: " + e.message);
                btn.innerHTML = originalHTML;
            }
        };

        window.toggleSessionDetails = (id) => {
            const el = document.getElementById(`details-${id}`);
            const txt = document.getElementById(`btn-text-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (!el) return;
            const open = el.classList.contains('details-expanded');
            if (open) { 
                el.classList.remove('details-expanded'); 
                if(txt) txt.innerText = 'Details'; 
                if(icon) icon.style.transform = 'rotate(0)'; 
            } else { 
                el.classList.add('details-expanded'); 
                if(txt) txt.innerText = 'Hide'; 
                if(icon) icon.style.transform = 'rotate(180deg)'; 
            }
        };

        window.addStudent = () => {
            const name = prompt("Student Name:");
            if (name) { classData.students.push({ id: Date.now().toString(), name: name }); updateStudentListUI(); renderGrid(); }
        };

        window.openBulkModal = () => document.getElementById('bulk-modal').classList.remove('hidden');
        window.closeBulkModal = () => document.getElementById('bulk-modal').classList.add('hidden');
        
        window.processBulk = () => {
            const txt = document.getElementById('bulk-input').value;
            const names = txt.split('\n').map(n => n.trim()).filter(n => n);
            names.forEach(n => { classData.students.push({ id: Date.now().toString() + Math.random().toString().substr(2, 5), name: n }); });
            updateStudentListUI(); closeBulkModal(); document.getElementById('bulk-input').value = '';
        };

        window.deleteStudent = (id) => {
            if(!confirm("Remove student?")) return;
            classData.students = classData.students.filter(s => s.id !== id);
            for(let key in classData.layout) { if(classData.layout[key] === id) delete classData.layout[key]; }
            updateStudentListUI(); renderGrid();
        };

        function updateStudentListUI() {
            const div = document.getElementById('roster-list');
            div.innerHTML = classData.students.map(s => `<div class="flex justify-between items-center text-sm py-1 group"><span>${s.name}</span><button onclick="deleteStudent('${s.id}')" class="text-red-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i></button></div>`).join('');
            document.getElementById('student-count').innerText = classData.students.length;
        }

        const ROWS = 6; const COLS = 8;
        window.handleDeskClick = (r, c) => {
            const tab = document.querySelector('.tab-btn.active').dataset.tab;
            if (tab !== 'layout') return;
            const key = `${r}-${c}`;
            if (classData.layout[key]) { delete classData.layout[key]; }
            else {
                const seatedIds = Object.values(classData.layout);
                const next = classData.students.find(s => !seatedIds.includes(s.id));
                if (next) classData.layout[key] = next.id;
            }
            renderGrid();
        };

        window.toggleStatus = (id, type) => {
            if (type === 'att') attendanceBuffer[id] = !attendanceBuffer[id];
            if (type === 'sub') submissionBuffer[id] = !submissionBuffer[id];
            renderGrid();
        };

        window.bulkToggle = (c, type) => {
            let anyOff = false;
            for(let r=0; r<ROWS; r++) {
                const sId = classData.layout[`${r}-${c}`];
                if(sId) {
                    const val = type === 'att' ? attendanceBuffer[sId] : submissionBuffer[sId];
                    if(!val) anyOff = true;
                }
            }
            for(let r=0; r<ROWS; r++) {
                const sId = classData.layout[`${r}-${c}`];
                if(sId) {
                    if(type === 'att') attendanceBuffer[sId] = anyOff;
                    if(type === 'sub') submissionBuffer[sId] = anyOff;
                }
            }
            renderGrid();
        };

        window.renderGrid = () => {
            const tab = document.querySelector('.tab-btn.active')?.dataset.tab || 'layout';
            const grid = document.getElementById('grid-container');
            const bulkContainer = document.getElementById('bulk-header');
            let html = '';
            const isTable = (r, c) => r === 0 ? (c >= 2 && c <= 5) : true;
            const getMargin = (c) => (c === 1 || c === 3 || c === 5) ? 'mr-10' : 'mr-1';

            if (tab === 'activity') {
                bulkContainer.classList.remove('hidden');
                let bHtml = '<div class="flex mb-4 justify-center">';
                for(let c=0; c<COLS; c++) {
                    const margin = getMargin(c);
                    bHtml += `
                        <div class="flex flex-col gap-1 w-24 items-center ${margin}">
                            <button onclick="bulkToggle(${c}, 'att')" class="w-full text-[9px] font-bold bg-blue-100 text-blue-600 rounded py-1 hover:bg-blue-200 uppercase">ALL ATT</button>
                            <button onclick="bulkToggle(${c}, 'sub')" class="w-full text-[9px] font-bold bg-green-100 text-green-600 rounded py-1 hover:bg-green-200 uppercase">ALL SUB</button>
                        </div>`;
                }
                bHtml += '</div>';
                bulkContainer.innerHTML = bHtml;
            } else {
                bulkContainer.classList.add('hidden');
                bulkContainer.innerHTML = '';
            }

            for(let r=0; r<ROWS; r++) {
                html += `<div class="flex mb-2 justify-center">`;
                for(let c=0; c<COLS; c++) {
                    const margin = getMargin(c);
                    if (!isTable(r, c)) { html += `<div class="w-24 h-24 ${margin}"></div>`; continue; }
                    const sId = classData.layout[`${r}-${c}`];
                    const student = sId ? classData.students.find(s => s.id === sId) : null;
                    const isPres = attendanceBuffer[sId]; const isSub = submissionBuffer[sId];
                    let borderClass = sId ? 'border-slate-300 bg-white shadow-sm' : 'border-slate-200 border-dashed bg-slate-50';
                    
                    html += `
                        <div onclick="handleDeskClick(${r},${c})" class="relative w-24 h-24 rounded-xl border-2 flex flex-col items-center justify-center p-1 transition-all ${margin} ${borderClass}">
                            ${ !sId ? `<i class="fas fa-plus text-slate-300"></i>` : `
                                <div class="text-center w-full">
                                    <div class="text-[10px] font-bold leading-tight mb-2 ${!isPres && tab === 'activity' ? 'text-slate-400' : 'text-slate-800'}">${student.name}</div>
                                    ${ tab === 'activity' ? `
                                        <div class="flex gap-1 justify-center" onclick="event.stopPropagation()">
                                            <button onclick="toggleStatus('${sId}', 'att')" class="w-6 h-6 rounded flex items-center justify-center ${isPres ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-300'}"><i class="fas fa-check text-[10px]"></i></button>
                                            <button onclick="toggleStatus('${sId}', 'sub')" class="w-6 h-6 rounded flex items-center justify-center ${isSub ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-300'}"><i class="fas fa-file text-[10px]"></i></button>
                                        </div>
                                    ` : ''}
                                </div>
                            `}
                        </div>`;
                }
                html += `</div>`;
            }
            grid.innerHTML = html;
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => {
                if(b.dataset.tab === tab) { b.classList.add('bg-blue-600', 'text-white', 'active'); b.classList.remove('text-slate-500'); }
                else { b.classList.remove('bg-blue-600', 'text-white', 'active'); b.classList.add('text-slate-500'); }
            });
            document.getElementById('view-layout-activity').classList.toggle('hidden', tab === 'history');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('sidebar-roster').classList.toggle('hidden', tab !== 'layout');
            document.getElementById('sidebar-actions-layout').classList.toggle('hidden', tab !== 'layout');
            document.getElementById('sidebar-actions-activity').classList.toggle('hidden', tab !== 'activity');
            renderGrid(); if(tab === 'history') loadHistory();
        };

        window.backToDash = () => { currentClassId = null; loadDashboard(); };
        function showScreen(name) {
            ['screen-login', 'screen-dashboard', 'screen-app', 'screen-setup'].forEach(s => document.getElementById(s).classList.add('hidden'));
            const map = { login: 'screen-login', dashboard: 'screen-dashboard', 'app-layout': 'screen-app' };
            document.getElementById(map[name] || name).classList.remove('hidden');
        }

        window.onload = initFirebase;
    </script>
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .details-expanded { max-height: 1000px !important; opacity: 1 !important; margin-top: 8px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 h-screen overflow-hidden">

    <div id="loading-overlay" class="fixed inset-0 bg-white/80 z-50 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="animate-spin text-blue-600 text-4xl"><i class="fas fa-circle-notch"></i></div>
    </div>

    <div id="screen-setup" class="hidden fixed inset-0 bg-slate-900 z-[60] flex flex-col items-center justify-center p-8 text-white">
        <h1 class="text-3xl font-bold mb-4">Config Required</h1>
        <p class="mb-4">Paste your Firebase Config in index.html line 18.</p>
        <button onclick="location.reload()" class="bg-blue-600 px-8 py-3 rounded-xl">Refresh</button>
    </div>

    <div id="screen-login" class="h-full flex flex-col items-center justify-center p-4">
        <div class="bg-white p-10 rounded-3xl shadow-xl text-center max-w-md w-full">
            <h1 class="text-3xl font-bold mb-6">ClassManager Pro</h1>
            <button onclick="login()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-3">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
        </div>
    </div>

    <div id="screen-dashboard" class="h-full hidden flex flex-col">
        <header class="bg-white border-b px-8 py-4 flex justify-between items-center shadow-sm">
            <h1 class="font-bold text-xl">ClassManager</h1>
            <div class="flex items-center gap-4">
                <img id="user-avatar" class="w-6 h-6 rounded-full" src="">
                <span id="user-name" class="text-sm font-bold">User</span>
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-8">
            <div class="flex justify-between mb-8">
                <h2 class="text-2xl font-bold">Your Classes</h2>
                <button onclick="createClass()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">+ New Class</button>
            </div>
            <div id="class-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <div id="screen-app" class="h-full hidden flex">
        <aside class="w-64 bg-slate-900 text-white flex flex-col p-6 border-r">
            <button onclick="backToDash()" class="text-xs text-slate-400 mb-4 uppercase">← Dashboard</button>
            <h2 id="class-name-display" class="text-xl font-bold mb-6">Class Name</h2>
            <div id="sidebar-roster">
                <div class="flex justify-between text-xs text-slate-500 mb-2 uppercase">Roster <span id="student-count">0</span></div>
                <div id="roster-list" class="max-h-48 overflow-y-auto mb-4 text-xs"></div>
                <button onclick="addStudent()" class="w-full bg-slate-800 text-white py-2 rounded text-xs">+ Add Student</button>
                <button onclick="openBulkModal()" class="w-full mt-2 text-slate-400 text-xs">Bulk Add</button>
            </div>
            <div class="mt-auto">
                <div id="sidebar-actions-layout">
                    <button onclick="saveClassData()" id="btn-save-layout" class="w-full bg-blue-600 py-3 rounded-xl font-bold text-sm shadow-lg"><i class="fas fa-save"></i> Save Layout</button>
                </div>
                <div id="sidebar-actions-activity" class="hidden space-y-2">
                    <button onclick="saveSpecificSession('attendance')" id="btn-save-att" class="w-full bg-blue-600 text-white hover:bg-blue-500 transition-colors py-3 rounded-xl font-bold text-sm shadow-lg"><i class="fas fa-user-check"></i> Save Attendance</button>
                    <button onclick="saveSpecificSession('submission')" id="btn-save-sub" class="w-full bg-green-600 text-white hover:bg-green-500 transition-colors py-3 rounded-xl font-bold text-sm shadow-lg"><i class="fas fa-file-upload"></i> Save Submission</button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden relative">
            <div class="bg-white border-b px-8 py-3 flex gap-4 shadow-sm">
                <button onclick="switchTab('layout')" data-tab="layout" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-blue-600 text-white active">Layout</button>
                <button onclick="switchTab('activity')" data-tab="activity" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm text-slate-500">Activity</button>
                <button onclick="switchTab('history')" data-tab="history" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm text-slate-500">History</button>
            </div>
            <div class="flex-1 overflow-y-auto p-8 pb-16">
                <div id="view-layout-activity" class="flex flex-col items-center">
                    
                    <div id="bulk-header" class="hidden w-full"></div>

                    <div id="grid-container"></div>
                </div>
                <div id="view-history" class="hidden max-w-2xl mx-auto">
                    <h3 class="font-bold mb-4">Records</h3>
                    <div id="history-list"></div>
                </div>
            </div>

            <div class="absolute bottom-0 left-0 w-full flex justify-center pointer-events-none z-10">
                <div class="bg-slate-800 text-white text-[10px] px-24 py-2.5 rounded-t-2xl uppercase tracking-widest font-bold shadow-[0_-10px_30px_rgba(0,0,0,0.15)] pointer-events-auto border-t-2 border-slate-600">
                    Whiteboard
                </div>
            </div>
        </main>
    </div>

    <div id="bulk-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-md">
            <h3 class="font-bold mb-2">Bulk Add</h3>
            <textarea id="bulk-input" class="w-full h-40 border p-2 mb-4 text-sm" placeholder="One name per line"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeBulkModal()" class="text-xs text-slate-500">Cancel</button>
                <button onclick="processBulk()" class="bg-blue-600 text-white text-xs px-4 py-2 rounded">Add Names</button>
            </div>
        </div>
    </div>
</body>
</html>
