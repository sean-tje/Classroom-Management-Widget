<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, orderBy, getDoc, deleteDoc, startAfter, limit, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAWjkNA5Bz80oJPLfRVJ-Ez4psCL7mP89U",
            authDomain: "classroom-management-widget.firebaseapp.com",
            projectId: "classroom-management-widget",
            storageBucket: "classroom-management-widget.firebasestorage.app",
            messagingSenderId: "97216302017",
            appId: "1:97216302017:web:67e49d5be0f015dcd47d40"
        };

        // Global State
        let app, auth, db, provider;
        let currentUser = null;
        let currentClassId = null;
        let classData = null; 
        let attendanceBuffer = {};
        let submissionBuffer = {};
        let historySessions = {}; 
        let lastVisibleDoc = null; 

        function initFirebase() {
            const hasKeys = Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey;
            if (!hasKeys) {
                document.getElementById('screen-setup').classList.remove('hidden');
                document.getElementById('screen-login').classList.add('hidden');
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                provider = new GoogleAuthProvider();
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        if(document.getElementById('user-name')) document.getElementById('user-name').innerText = user.displayName;
                        if(document.getElementById('user-avatar')) document.getElementById('user-avatar').src = user.photoURL;
                        window.loadDashboard();
                    } else {
                        currentUser = null;
                        showScreen('login');
                    }
                });
            } catch (e) {
                console.error("Firebase initialization failed:", e);
            }
        }

        window.login = async () => {
            if (!auth) return alert("Firebase not connected.");
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert("Login Failed: " + error.message); }
        };

        window.logout = () => signOut(auth);

        window.loadDashboard = async () => {
            if (!currentUser) return;
            showScreen('dashboard');
            const list = document.getElementById('class-grid');
            list.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>';
            
            try {
                const q = query(collection(db, `users/${currentUser.uid}/classes`));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    list.innerHTML = `<div class="col-span-full text-center py-10"><h3 class="text-slate-600 font-medium">No classes yet</h3></div>`;
                } else {
                    const classes = [];
                    snapshot.forEach(doc => classes.push({ id: doc.id, ...doc.data() }));
                    classes.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
                    list.innerHTML = '';
                    classes.forEach(cls => {
                        list.innerHTML += `
                            <div onclick="enterClass('${cls.id}')" class="group relative bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-blue-300 hover:shadow-md cursor-pointer transition-all">
                                <button onclick="deleteClass('${cls.id}', event)" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-2" title="Delete Class">
                                    <i class="fas fa-trash"></i>
                                </button>
                                <h3 class="font-bold text-lg text-slate-800 truncate pr-8">${cls.name}</h3>
                                <p class="text-xs text-slate-400 mt-1">${cls.students ? cls.students.length : 0} Students</p>
                            </div>`;
                    });
                }
            } catch (e) { list.innerHTML = `<p class="text-red-500 text-center py-10">Error loading classes.</p>`; }
        };

        window.createClass = async () => {
            const name = prompt("Enter Class Name:");
            if (!name) return;
            try {
                await addDoc(collection(db, `users/${currentUser.uid}/classes`), { name: name, students: [], layout: {}, createdAt: new Date() });
                loadDashboard();
            } catch (e) { alert("Error: " + e.message); }
        };

        window.deleteClass = async (classId, event) => {
            event.stopPropagation(); 
            if(!confirm("Are you sure you want to delete this class?")) return;
            try { await deleteDoc(doc(db, `users/${currentUser.uid}/classes/${classId}`)); loadDashboard(); } 
            catch(e) { alert("Error deleting class: " + e.message); }
        };

        window.enterClass = async (classId) => {
            currentClassId = classId;
            showScreen('app-layout');
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                const docSnap = await getDoc(doc(db, `users/${currentUser.uid}/classes/${classId}`));
                if (docSnap.exists()) {
                    classData = docSnap.data();
                    attendanceBuffer = {}; submissionBuffer = {};
                    document.getElementById('class-name-display').innerText = classData.name;
                    updateStudentListUI(); renderGrid(); switchTab('layout');
                }
            } catch (e) { console.error(e); }
            document.getElementById('loading-overlay').classList.add('hidden');
        };

        window.saveClassData = async () => {
            if (!currentClassId) return;
            const btn = document.getElementById('btn-save-layout');
            const origHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            try {
                await updateDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}`), { students: classData.students, layout: classData.layout });
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => btn.innerHTML = origHTML, 2000);
            } catch (e) { btn.innerHTML = origHTML; }
        };

        window.saveSpecificSession = async (type) => {
            if (!currentClassId) return;
            const label = prompt(`Enter a label for this ${type} record\n(e.g., 'Week 1', 'Math Homework'):`);
            if (label === null) return; 

            const btnId = type === 'attendance' ? 'btn-save-att' : 'btn-save-sub';
            const btn = document.getElementById(btnId);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const timestamp = new Date();
            const sessionData = {
                date: timestamp.toLocaleDateString(), 
                timestamp: timestamp,
                type: type,
                label: label || (type === 'attendance' ? 'Attendance' : 'Submission'),
                records: classData.students.map(s => ({
                    id: s.id, name: s.name, 
                    status: type === 'attendance' ? (attendanceBuffer[s.id] || false) : (submissionBuffer[s.id] || false)
                }))
            };

            try {
                await addDoc(collection(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions`), sessionData);
                if (type === 'attendance') attendanceBuffer = {};
                if (type === 'submission') submissionBuffer = {};
                renderGrid();
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => { btn.innerHTML = originalHTML; switchTab('history'); }, 1000);
            } catch (e) { btn.innerHTML = originalHTML; alert("Error saving: " + e.message); }
        };

        window.deleteSession = async (sessId) => {
            if(!confirm("Are you sure you want to delete this record?")) return;
            try {
                await deleteDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions/${sessId}`));
                loadHistory(false); 
            } catch (e) { alert("Error deleting record: " + e.message); }
        };

        window.loadHistory = async (isLoadMore = false) => {
            const container = document.getElementById('history-list');
            const loadMoreBtnContainer = document.getElementById('load-more-container');
            const filterVal = document.getElementById('history-filter').value;
            
            if (!isLoadMore) {
                container.innerHTML = '<div id="history-items-grid" class="space-y-4"><div class="text-center py-8 text-slate-400"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div></div>';
                lastVisibleDoc = null;
                historySessions = {}; 
            }

            const limitCount = isLoadMore ? 10 : 20;

            try {
                const collectionRef = collection(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions`);
                let queryConstraints = [];
                
                if (filterVal !== 'all') queryConstraints.push(where("type", "==", filterVal));
                queryConstraints.push(orderBy("timestamp", "desc"));
                if (isLoadMore && lastVisibleDoc) queryConstraints.push(startAfter(lastVisibleDoc));
                queryConstraints.push(limit(limitCount));

                const q = query(collectionRef, ...queryConstraints);
                const snapshot = await getDocs(q);
                const itemsGrid = document.getElementById('history-items-grid');
                
                if (!isLoadMore) itemsGrid.innerHTML = ''; 
                
                if (snapshot.empty && !isLoadMore) {
                    itemsGrid.innerHTML = '<div class="text-center py-8 text-slate-400">No records found.</div>';
                    if(loadMoreBtnContainer) loadMoreBtnContainer.classList.add('hidden');
                    return;
                }

                lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
                let html = '';
                
                snapshot.forEach(docSnap => {
                    const sess = docSnap.data();
                    const sid = docSnap.id;
                    sess.records = sess.records.map(r => ({ ...r, status: r.status !== undefined ? r.status : (sess.type === 'submission' ? r.submitted : r.present) }));
                    historySessions[sid] = { id: sid, ...sess }; 
                    
                    const activeCount = sess.records.filter(r => r.status).length;
                    const totalCount = sess.records.length;
                    const isAtt = sess.type !== 'submission'; 
                    const typeLabel = isAtt ? 'Attendance' : 'Submission';
                    const colorClass = isAtt ? 'text-blue-600 bg-blue-50 border-blue-200' : 'text-green-600 bg-green-50 border-green-200';
                    const dotColorTrue = isAtt ? 'bg-blue-400' : 'bg-green-400';
                    
                    html += `
                        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm transition-all duration-300">
                            <div class="flex justify-between items-start">
                                <div class="overflow-hidden">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-[9px] font-bold px-2 py-0.5 rounded uppercase border ${colorClass}">${typeLabel}</span>
                                        <h4 class="font-bold text-slate-700 text-sm truncate" title="${sess.label}">${sess.label}</h4>
                                    </div>
                                    <p class="text-[10px] text-slate-400 font-medium mb-1">${sess.date}</p>
                                    <p class="text-[10px] text-slate-500 font-bold uppercase">${isAtt ? 'Present' : 'Submitted'}: <span id="hist-count-${sid}">${activeCount}/${totalCount}</span></p>
                                </div>
                                <div class="flex items-center gap-2 pl-2">
                                    <button onclick="exportToCSV('${sid}')" class="text-slate-500 hover:text-blue-600 bg-slate-50 border border-slate-200 p-1.5 rounded-lg transition-colors" title="Export to CSV"><i class="fas fa-file-csv"></i></button>
                                    <button onclick="toggleSessionDetails('${sid}')" class="text-slate-600 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center hover:bg-slate-100 transition-colors"><span id="btn-text-${sid}">Details</span> <i id="icon-${sid}" class="fas fa-chevron-down ml-2"></i></button>
                                    <button onclick="deleteSession('${sid}')" class="text-slate-300 hover:text-red-500 transition-colors p-1.5" title="Delete record"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                            <div id="details-${sid}" class="text-xs text-slate-500 max-h-0 overflow-hidden opacity-0 transition-all duration-500 ease-in-out">
                                <div class="border-t border-slate-100 mt-4 pt-3 grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    ${sess.records.map(r => `
                                        <div onclick="toggleHistoryStatus('${sid}', '${r.id}')" class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-100 cursor-pointer hover:border-blue-300">
                                            <div id="hist-dot-${sid}-${r.id}" class="w-2 h-2 rounded-full ${r.status ? dotColorTrue : 'bg-red-400'}"></div>
                                            <span id="hist-name-${sid}-${r.id}" class="truncate ${!r.status ? 'text-red-500 font-medium' : 'text-slate-600'}">${r.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div id="hist-save-container-${sid}" class="hidden mt-4 pt-3 border-t border-slate-100 flex justify-end">
                                    <button id="hist-save-btn-${sid}" onclick="saveHistoryEdits('${sid}')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors flex items-center gap-2"><i class="fas fa-save"></i> Save Changes</button>
                                </div>
                            </div>
                        </div>`;
                });

                itemsGrid.insertAdjacentHTML('beforeend', html);

                if (snapshot.docs.length < limitCount) {
                    loadMoreBtnContainer.innerHTML = '<p class="text-slate-400 text-xs py-4 text-center">End of history</p>';
                    loadMoreBtnContainer.classList.remove('hidden');
                } else {
                    loadMoreBtnContainer.innerHTML = `<button onclick="loadHistory(true)" class="mt-4 mb-8 bg-white border border-slate-200 text-slate-600 px-6 py-2 rounded-full text-xs font-bold hover:bg-slate-50 shadow-sm transition-all mx-auto block">Load 10 More Records</button>`;
                    loadMoreBtnContainer.classList.remove('hidden');
                }

            } catch (e) {
                console.error("History Error:", e);
                const itemsGrid = document.getElementById('history-items-grid');
                if (e.message && e.message.includes("index")) {
                    const linkMatch = e.message.match(/https:\/\/console\.firebase\.google\.com[^\s]*/);
                    const link = linkMatch ? linkMatch[0] : '#';
                    if(itemsGrid) itemsGrid.innerHTML = `
                        <div class="bg-red-50 border border-red-200 p-6 rounded-xl text-center">
                            <i class="fas fa-exclamation-triangle text-red-500 text-2xl mb-2"></i>
                            <h4 class="font-bold text-red-700 mb-1">Database Index Required</h4>
                            <p class="text-xs text-red-500 mb-4">To filter records, Firebase requires a specific database index to be built. Click below to generate it automatically.</p>
                            <a href="${link}" target="_blank" class="inline-block bg-red-600 text-white font-bold py-2 px-4 rounded shadow hover:bg-red-700 transition-colors">Build Index in Console</a>
                        </div>`;
                } else {
                    if(itemsGrid) itemsGrid.innerHTML += `<p class="text-red-500 text-center py-4">Error loading records.</p>`;
                }
            }
        };

        window.loadOverview = async () => {
            const container = document.getElementById('overview-content');
            container.innerHTML = '<div class="text-center py-10 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i><p>Calculating aggregates...</p></div>';
            
            try {
                const q = query(collection(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions`));
                const snapshot = await getDocs(q);
                
                let totalAtt = 0; let totalSub = 0; let studentStats = {}; 
                classData.students.forEach(s => { studentStats[s.id] = { name: s.name, att: 0, sub: 0 }; });

                snapshot.forEach(docSnap => {
                    const sess = docSnap.data();
                    if (sess.type === 'attendance') totalAtt++;
                    if (sess.type === 'submission') totalSub++;
                    
                    sess.records.forEach(r => {
                        if (!studentStats[r.id]) studentStats[r.id] = { name: r.name, att: 0, sub: 0 };
                        const status = r.status !== undefined ? r.status : (sess.type === 'submission' ? r.submitted : r.present);
                        if (status) {
                            if (sess.type === 'attendance') studentStats[r.id].att++;
                            if (sess.type === 'submission') studentStats[r.id].sub++;
                        }
                    });
                });

                const getPctColor = (pct) => {
                    if (pct >= 90) return 'text-green-600 font-bold';
                    if (pct >= 70) return 'text-slate-700';
                    return 'text-red-500 font-bold';
                };

                let html = `
                    <div class="mb-4 flex gap-4 text-sm">
                        <div class="bg-blue-50 text-blue-800 px-4 py-2 rounded-lg border border-blue-100"><span class="font-bold">${totalAtt}</span> Total Att. Sessions</div>
                        <div class="bg-green-50 text-green-800 px-4 py-2 rounded-lg border border-green-100"><span class="font-bold">${totalSub}</span> Total Sub. Sessions</div>
                    </div>
                    <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500">
                                <tr>
                                    <th class="px-4 py-3 font-bold">Student Name</th>
                                    <th class="px-4 py-3 font-bold text-center border-l border-slate-100">Attendance</th>
                                    <th class="px-4 py-3 font-bold text-center border-l border-slate-100">Submissions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">`;

                const sortedIds = Object.keys(studentStats).sort((a,b) => studentStats[a].name.localeCompare(studentStats[b].name));
                sortedIds.forEach(id => {
                    const st = studentStats[id];
                    const attPct = totalAtt > 0 ? Math.round((st.att / totalAtt) * 100) : 0;
                    const subPct = totalSub > 0 ? Math.round((st.sub / totalSub) * 100) : 0;
                    
                    html += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-3 font-medium text-slate-800">${st.name}</td>
                            <td class="px-4 py-3 text-center border-l border-slate-100">
                                ${totalAtt > 0 ? `<span class="text-xs text-slate-400 mr-2">${st.att}/${totalAtt}</span> <span class="${getPctColor(attPct)}">${attPct}%</span>` : '-'}
                            </td>
                            <td class="px-4 py-3 text-center border-l border-slate-100">
                                ${totalSub > 0 ? `<span class="text-xs text-slate-400 mr-2">${st.sub}/${totalSub}</span> <span class="${getPctColor(subPct)}">${subPct}%</span>` : '-'}
                            </td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                container.innerHTML = html;

            } catch(e) { container.innerHTML = `<div class="text-center py-8 text-red-500">Error calculating overview: ${e.message}</div>`; }
        };

        window.toggleHistoryStatus = (sessId, studentId) => {
            const sess = historySessions[sessId];
            const student = sess.records.find(r => r.id === studentId);
            student.status = !student.status; 
            const dot = document.getElementById(`hist-dot-${sessId}-${studentId}`);
            const text = document.getElementById(`hist-name-${sessId}-${studentId}`);
            const isAtt = sess.type !== 'submission';
            const dotColorTrue = isAtt ? 'bg-blue-400' : 'bg-green-400';
            if(student.status) { dot.className = `w-2 h-2 rounded-full ${dotColorTrue}`; text.className = `truncate text-slate-600`; } 
            else { dot.className = `w-2 h-2 rounded-full bg-red-400`; text.className = `truncate text-red-500 font-medium`; }
            document.getElementById(`hist-save-container-${sessId}`).classList.remove('hidden');
        };

        window.saveHistoryEdits = async (sessId) => {
            const btn = document.getElementById(`hist-save-btn-${sessId}`);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            try {
                const sess = historySessions[sessId];
                await updateDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions/${sessId}`), { records: sess.records });
                const activeCount = sess.records.filter(r => r.status).length;
                document.getElementById(`hist-count-${sessId}`).innerText = `${activeCount}/${sess.records.length}`;
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => { document.getElementById(`hist-save-container-${sessId}`).classList.add('hidden'); btn.innerHTML = originalHTML; }, 1000);
            } catch(e) { alert("Error: " + e.message); btn.innerHTML = originalHTML; }
        };

        window.exportToCSV = (sessId) => {
            const sess = historySessions[sessId];
            if (!sess) return;
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += `Record Label,${sess.label}\nDate,${sess.date}\nType,${sess.type.toUpperCase()}\n\nStudent Name,Status\n`;
            sess.records.forEach(r => { csvContent += `"${r.name}",${r.status ? (sess.type === 'attendance' ? "Present" : "Submitted") : "Missing"}\n`; });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `${sess.label.replace(/\s+/g, '_')}_${sess.type}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        window.toggleSessionDetails = (id) => {
            const el = document.getElementById(`details-${id}`);
            const txt = document.getElementById(`btn-text-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (!el) return;
            if (el.classList.contains('details-expanded')) { el.classList.remove('details-expanded'); if(txt) txt.innerText = 'Details'; if(icon) icon.style.transform = 'rotate(0)'; } 
            else { el.classList.add('details-expanded'); if(txt) txt.innerText = 'Hide'; if(icon) icon.style.transform = 'rotate(180deg)'; }
        };

        window.addStudent = () => {
            const name = prompt("Student Name:");
            if (name) { classData.students.push({ id: Date.now().toString(), name: name }); updateStudentListUI(); renderGrid(); }
        };

        window.openBulkModal = () => document.getElementById('bulk-modal').classList.remove('hidden');
        window.closeBulkModal = () => document.getElementById('bulk-modal').classList.add('hidden');
        window.processBulk = () => {
            const names = document.getElementById('bulk-input').value.split('\n').map(n => n.trim()).filter(n => n);
            names.forEach(n => classData.students.push({ id: Date.now().toString() + Math.random().toString().substr(2, 5), name: n }));
            updateStudentListUI(); closeBulkModal(); document.getElementById('bulk-input').value = '';
        };

        window.deleteStudent = (id) => {
            if(!confirm("Remove student?")) return;
            classData.students = classData.students.filter(s => s.id !== id);
            for(let key in classData.layout) { if(classData.layout[key] === id) delete classData.layout[key]; }
            updateStudentListUI(); renderGrid();
        };

        function updateStudentListUI() {
            const div = document.getElementById('roster-list');
            div.innerHTML = classData.students.map(s => `<div class="flex justify-between items-center text-sm py-1 group"><span>${s.name}</span><button onclick="deleteStudent('${s.id}')" class="text-red-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i></button></div>`).join('');
            document.getElementById('student-count').innerText = classData.students.length;
        }

        const ROWS = 6; const COLS = 8;
        window.handleDeskClick = (r, c) => {
            const tab = document.querySelector('.tab-btn.active').dataset.tab;
            if (tab !== 'layout') return;
            const key = `${r}-${c}`;
            if (classData.layout[key]) { delete classData.layout[key]; }
            else {
                const seatedIds = Object.values(classData.layout);
                const next = classData.students.find(s => !seatedIds.includes(s.id));
                if (next) classData.layout[key] = next.id;
            }
            renderGrid();
        };

        window.toggleStatus = (id, type) => {
            if (type === 'att') attendanceBuffer[id] = !attendanceBuffer[id];
            if (type === 'sub') submissionBuffer[id] = !submissionBuffer[id];
            renderGrid();
        };

        window.bulkToggle = (c, type) => {
            let anyOff = false;
            for(let r=0; r<ROWS; r++) { const sId = classData.layout[`${r}-${c}`]; if(sId && !(type === 'att' ? attendanceBuffer[sId] : submissionBuffer[sId])) anyOff = true; }
            for(let r=0; r<ROWS; r++) { const sId = classData.layout[`${r}-${c}`]; if(sId) { if(type === 'att') attendanceBuffer[sId] = anyOff; if(type === 'sub') submissionBuffer[sId] = anyOff; } }
            renderGrid();
        };

        window.renderGrid = () => {
            const tab = document.querySelector('.tab-btn.active')?.dataset.tab || 'layout';
            const grid = document.getElementById('grid-container');
            const bulkContainer = document.getElementById('bulk-header');
            let html = '';
            const isTable = (r, c) => r === 0 ? (c >= 2 && c <= 5) : true;
            const getMargin = (c) => (c === 1 || c === 3 || c === 5) ? 'mr-10' : 'mr-1';

            if (tab === 'activity') {
                bulkContainer.classList.remove('hidden');
                let bHtml = '<div class="flex mb-4 justify-center">';
                for(let c=0; c<COLS; c++) {
                    bHtml += `<div class="flex flex-col gap-1 w-24 items-center ${getMargin(c)}"><button onclick="bulkToggle(${c}, 'att')" class="w-full text-[9px] font-bold bg-blue-100 text-blue-600 rounded py-1 hover:bg-blue-200 uppercase">ALL ATT</button><button onclick="bulkToggle(${c}, 'sub')" class="w-full text-[9px] font-bold bg-green-100 text-green-600 rounded py-1 hover:bg-green-200 uppercase">ALL SUB</button></div>`;
                }
                bHtml += '</div>';
                bulkContainer.innerHTML = bHtml;
            } else { bulkContainer.classList.add('hidden'); bulkContainer.innerHTML = ''; }

            for(let r=0; r<ROWS; r++) {
                html += `<div class="flex mb-2 justify-center">`;
                for(let c=0; c<COLS; c++) {
                    const margin = getMargin(c);
                    if (!isTable(r, c)) { html += `<div class="w-24 h-24 ${margin}"></div>`; continue; }
                    const sId = classData.layout[`${r}-${c}`];
                    const student = sId ? classData.students.find(s => s.id === sId) : null;
                    const isPres = attendanceBuffer[sId]; const isSub = submissionBuffer[sId];
                    let borderClass = sId ? 'border-slate-300 bg-white shadow-sm' : 'border-slate-200 border-dashed bg-slate-50';
                    
                    html += `<div onclick="handleDeskClick(${r},${c})" class="relative w-24 h-24 rounded-xl border-2 flex flex-col items-center justify-center p-1 transition-all ${margin} ${borderClass}">
                            ${ !sId ? `<i class="fas fa-plus text-slate-300"></i>` : `
                                <div class="text-center w-full"><div class="text-[10px] font-bold leading-tight mb-2 ${!isPres && tab === 'activity' ? 'text-slate-400' : 'text-slate-800'}">${student.name}</div>
                                    ${ tab === 'activity' ? `<div class="flex gap-1 justify-center" onclick="event.stopPropagation()"><button onclick="toggleStatus('${sId}', 'att')" class="w-6 h-6 rounded flex items-center justify-center ${isPres ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-300'}"><i class="fas fa-check text-[10px]"></i></button><button onclick="toggleStatus('${sId}', 'sub')" class="w-6 h-6 rounded flex items-center justify-center ${isSub ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-300'}"><i class="fas fa-file text-[10px]"></i></button></div>` : ''}
                                </div>`}</div>`;
                }
                html += `</div>`;
            }
            grid.innerHTML = html;
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => {
                if(b.dataset.tab === tab) { b.classList.add('bg-blue-600', 'text-white', 'active'); b.classList.remove('text-slate-500', 'bg-slate-200'); }
                else { b.classList.remove('bg-blue-600', 'text-white', 'active'); b.classList.add('text-slate-500', 'bg-slate-200'); }
            });
            
            document.getElementById('view-layout-activity').classList.toggle('hidden', (tab === 'history' || tab === 'overview'));
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('view-overview').classList.toggle('hidden', tab !== 'overview');
            document.getElementById('sidebar-roster').classList.toggle('hidden', tab !== 'layout');
            
            // Toggle Dynamic Actions based on context (hidden on history & overview)
            document.getElementById('btn-save-layout').classList.toggle('hidden', tab !== 'layout');
            document.getElementById('btn-save-att').classList.toggle('hidden', tab !== 'activity');
            document.getElementById('btn-save-sub').classList.toggle('hidden', tab !== 'activity');
            
            renderGrid(); 
            if(tab === 'history') loadHistory(false);
            if(tab === 'overview') loadOverview();
        };

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('class-sidebar');
            const toggleIcon = document.getElementById('sidebar-toggle-icon');
            const isOpen = !sidebar.classList.contains('sidebar-closed');
            
            if (isOpen) {
                sidebar.classList.add('sidebar-closed');
                toggleIcon.classList.remove('fa-chevron-left');
                toggleIcon.classList.add('fa-chevron-right');
            } else {
                sidebar.classList.remove('sidebar-closed');
                toggleIcon.classList.remove('fa-chevron-right');
                toggleIcon.classList.add('fa-chevron-left');
            }
        };

        window.backToDash = () => { currentClassId = null; loadDashboard(); };
        function showScreen(name) {
            ['screen-login', 'screen-dashboard', 'screen-app', 'screen-setup'].forEach(s => document.getElementById(s).classList.add('hidden'));
            const map = { login: 'screen-login', dashboard: 'screen-dashboard', 'app-layout': 'screen-app' };
            document.getElementById(map[name] || name).classList.remove('hidden');
        }

        window.onload = initFirebase;
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .details-expanded { max-height: 1000px !important; opacity: 1 !important; margin-top: 8px; }

        /* Smooth CSS Transitions for Hiding/Showing Sidebar */
        .sidebar-transition {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
        }
        .sidebar-closed {
            width: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            border-right: none !important;
        }

        /* Scaled to 90% (up 10% from the previous 80% setting) */
        #grid-container {
            transform: scale(0.9);
            transform-origin: top center;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 h-screen overflow-hidden">

    <div id="loading-overlay" class="fixed inset-0 bg-white/80 z-50 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="animate-spin text-blue-600 text-4xl"><i class="fas fa-circle-notch"></i></div>
    </div>

    <div id="screen-setup" class="hidden fixed inset-0 bg-slate-900 z-[60] flex flex-col items-center justify-center p-8 text-white">
        <h1 class="text-3xl font-bold mb-4">Config Required</h1>
        <button onclick="location.reload()" class="bg-blue-600 px-8 py-3 rounded-xl">Refresh</button>
    </div>

    <div id="screen-login" class="h-full flex flex-col items-center justify-center p-4">
        <div class="bg-white p-10 rounded-3xl shadow-xl text-center max-w-md w-full">
            <h1 class="text-3xl font-bold mb-6">ClassManager Pro</h1>
            <button onclick="login()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold flex gap-3 justify-center"><i class="fab fa-google"></i> Sign in</button>
        </div>
    </div>

    <div id="screen-dashboard" class="h-full hidden flex flex-col">
        <header class="bg-white border-b px-8 py-4 flex justify-between items-center shadow-sm">
            <h1 class="font-bold text-xl">ClassManager</h1>
            <div class="flex items-center gap-4">
                <img id="user-avatar" class="w-6 h-6 rounded-full" src="">
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-8">
            <div class="flex justify-between mb-8">
                <h2 class="text-2xl font-bold">Your Classes</h2>
                <button onclick="createClass()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">+ New Class</button>
            </div>
            <div id="class-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <div id="screen-app" class="h-full hidden flex">
        
        <aside id="class-sidebar" class="w-44 sidebar-transition bg-slate-900 text-white flex flex-col p-4 border-r relative h-full">
            <button onclick="backToDash()" class="text-xs text-slate-400 mb-4 uppercase text-left">← Dashboard</button>
            <h2 id="class-name-display" class="text-base font-bold mb-6 truncate">Class Name</h2>
            
            <div id="sidebar-roster">
                <div class="flex justify-between text-xs text-slate-500 mb-2 uppercase">Roster <span id="student-count">0</span></div>
                <div id="roster-list" class="max-h-64 overflow-y-auto mb-4 text-xs"></div>
                <button onclick="addStudent()" class="w-full bg-slate-800 text-white py-2 rounded text-xs">+ Add Student</button>
                <button onclick="openBulkModal()" class="w-full mt-2 text-slate-400 text-xs">Bulk Add</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden relative">
            
            <button onclick="toggleSidebar()" class="absolute left-0 top-3 border border-slate-300 border-l-0 bg-white text-slate-600 hover:text-blue-600 w-6 h-8 rounded-r-lg shadow-sm z-20 flex items-center justify-center transition-colors">
                <i id="sidebar-toggle-icon" class="fas fa-chevron-left text-xs"></i>
            </button>

            <div class="bg-white border-b pl-10 pr-8 py-3 flex gap-2 shadow-sm flex-wrap">
                <button onclick="switchTab('layout')" data-tab="layout" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-blue-600 text-white active">Layout</button>
                <button onclick="switchTab('activity')" data-tab="activity" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-slate-200 text-slate-500">Activity</button>
                <button onclick="switchTab('history')" data-tab="history" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-slate-200 text-slate-500">History</button>
                <button onclick="switchTab('overview')" data-tab="overview" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-slate-200 text-slate-500">Overview</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 pb-16 relative">
                
                <div id="floating-actions" class="absolute top-6 left-6 z-10 flex gap-2">
                    <button onclick="saveClassData()" id="btn-save-layout" class="bg-white border-2 border-blue-600 text-blue-600 hover:bg-blue-50 transition-colors py-2 px-4 rounded-xl font-bold text-sm shadow-md flex items-center gap-2">
                        <i class="fas fa-save"></i> Save Layout
                    </button>
                    <button onclick="saveSpecificSession('attendance')" id="btn-save-att" class="hidden bg-blue-600 text-white hover:bg-blue-500 transition-colors py-2 px-4 rounded-xl font-bold text-sm shadow-md flex items-center gap-2">
                        <i class="fas fa-user-check"></i> Save Attendance
                    </button>
                    <button onclick="saveSpecificSession('submission')" id="btn-save-sub" class="hidden bg-green-600 text-white hover:bg-green-500 transition-colors py-2 px-4 rounded-xl font-bold text-sm shadow-md flex items-center gap-2">
                        <i class="fas fa-file-upload"></i> Save Submission
                    </button>
                </div>

                <div id="view-layout-activity" class="flex flex-col items-center pt-10">
                    <div id="bulk-header" class="hidden w-full"></div>
                    <div id="grid-container"></div>
                    
                    <div class="mt-4 bg-slate-800 text-white text-[10px] px-32 py-3 rounded-xl uppercase tracking-widest font-bold shadow-md border border-slate-600">
                        Whiteboard
                    </div>
                </div>
                
                <div id="view-history" class="hidden max-w-2xl mx-auto">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800">Class History</h3>
                        <select id="history-filter" onchange="loadHistory(false)" class="bg-white border border-slate-300 text-slate-700 text-xs rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                            <option value="all">Show All</option>
                            <option value="attendance">Attendance Only</option>
                            <option value="submission">Submissions Only</option>
                        </select>
                    </div>
                    <div id="history-list"></div>
                    <div id="load-more-container" class="flex justify-center mt-6 mb-12 hidden"></div>
                </div>

                <div id="view-overview" class="hidden max-w-3xl mx-auto">
                    <h3 class="font-bold mb-4 text-slate-800">Student Overview (YTD)</h3>
                    <div id="overview-content"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="bulk-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-md">
            <h3 class="font-bold mb-2">Bulk Add</h3>
            <textarea id="bulk-input" class="w-full h-40 border p-2 mb-4 text-sm" placeholder="One name per line"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeBulkModal()" class="text-xs text-slate-500">Cancel</button>
                <button onclick="processBulk()" class="bg-blue-600 text-white text-xs px-4 py-2 rounded">Add</button>
            </div>
        </div>
    </div>
</body>
</html>
