<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, orderBy, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWjkNA5Bz80oJPLfRVJ-Ez4psCL7mP89U",
            authDomain: "classroom-management-widget.firebaseapp.com",
            projectId: "classroom-management-widget",
            storageBucket: "classroom-management-widget.firebasestorage.app",
            messagingSenderId: "97216302017",
            appId: "1:97216302017:web:67e49d5be0f015dcd47d40"
        };

        // Global State
        let app, auth, db, provider;
        let currentUser = null;
        let currentClassId = null;
        let classData = null; 
        let attendanceBuffer = {};
        let submissionBuffer = {};

        function initFirebase() {
            const hasKeys = Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey;
            if (!hasKeys) {
                document.getElementById('screen-setup').classList.remove('hidden');
                document.getElementById('screen-login').classList.add('hidden');
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                provider = new GoogleAuthProvider();
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        if(document.getElementById('user-name')) document.getElementById('user-name').innerText = user.displayName;
                        if(document.getElementById('user-avatar')) document.getElementById('user-avatar').src = user.photoURL;
                        window.loadDashboard();
                    } else {
                        currentUser = null;
                        showScreen('login');
                    }
                });
            } catch (e) {
                console.error("Firebase initialization failed:", e);
            }
        }

        window.login = async () => {
            if (!auth) return alert("Firebase not connected.");
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Login Failed: " + error.message);
            }
        };

        window.logout = () => signOut(auth);

        window.loadDashboard = async () => {
            if (!currentUser) return;
            showScreen('dashboard');
            const list = document.getElementById('class-grid');
            list.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>';
            
            try {
                const q = query(collection(db, `users/${currentUser.uid}/classes`));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    list.innerHTML = `<div class="col-span-full text-center py-10"><h3 class="text-slate-600 font-medium">No classes yet</h3></div>`;
                } else {
                    const classes = [];
                    snapshot.forEach(doc => classes.push({ id: doc.id, ...doc.data() }));
                    classes.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
                    list.innerHTML = '';
                    classes.forEach(cls => {
                        list.innerHTML += `
                            <div onclick="enterClass('${cls.id}')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md cursor-pointer transition-all">
                                <h3 class="font-bold text-lg text-slate-800 truncate">${cls.name}</h3>
                                <p class="text-xs text-slate-400 mt-1">${cls.students ? cls.students.length : 0} Students</p>
                            </div>`;
                    });
                }
            } catch (e) {
                list.innerHTML = `<p class="text-red-500 text-center py-10">Error loading classes.</p>`;
            }
        };

        window.createClass = async () => {
            const name = prompt("Enter Class Name:");
            if (!name) return;
            try {
                await addDoc(collection(db, `users/${currentUser.uid}/classes`), {
                    name: name, students: [], layout: {}, createdAt: new Date()
                });
                loadDashboard();
            } catch (e) { alert("Error: " + e.message); }
        };

        window.enterClass = async (classId) => {
            currentClassId = classId;
            showScreen('app-layout');
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                const docSnap = await getDoc(doc(db, `users/${currentUser.uid}/classes/${classId}`));
                if (docSnap.exists()) {
                    classData = docSnap.data();
                    attendanceBuffer = {}; submissionBuffer = {};
                    document.getElementById('class-name-display').innerText = classData.name;
                    updateStudentListUI(); renderGrid(); switchTab('layout');
                }
            } catch (e) { console.error(e); }
            document.getElementById('loading-overlay').classList.add('hidden');
        };

        window.saveClassData = async () => {
            if (!currentClassId) return;
            const btn = document.getElementById('btn-save-layout');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            try {
                await updateDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}`), {
                    students: classData.students, layout: classData.layout
                });
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => btn.innerHTML = '<i class="fas fa-save"></i> Save Layout', 2000);
            } catch (e) { btn.innerHTML = '<i class="fas fa-save"></i> Save Layout'; }
        };

        // NEW: Function to save specific types of records with a label
        window.saveSpecificSession = async (type) => {
            if (!currentClassId) return;
            
            // Ask for a label
            const label = prompt(`Enter a label for this ${type} record\n(e.g., 'Week 1', 'Math Homework'):`);
            if (label === null) return; // User cancelled

            const btnId = type === 'attendance' ? 'btn-save-att' : 'btn-save-sub';
            const btn = document.getElementById(btnId);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const timestamp = new Date();
            const sessionData = {
                date: timestamp.toLocaleString(), 
                timestamp: timestamp,
                type: type,
                label: label || (type === 'attendance' ? 'Attendance' : 'Submission'),
                records: classData.students.map(s => ({
                    id: s.id, 
                    name: s.name, 
                    status: type === 'attendance' ? (attendanceBuffer[s.id] || false) : (submissionBuffer[s.id] || false)
                }))
            };

            try {
                await addDoc(collection(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions`), sessionData);
                
                // Clear only the buffer that was just saved
                if (type === 'attendance') attendanceBuffer = {};
                if (type === 'submission') submissionBuffer = {};
                renderGrid();
                
                btn.innerHTML = '<i class="fas fa-check"></i> Saved';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    switchTab('history');
                }, 1000);
            } catch (e) { 
                btn.innerHTML = originalHTML;
                alert("Error saving session: " + e.message); 
            }
        };

        window.deleteSession = async (sessId) => {
            if(!confirm("Are you sure you want to delete this record? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions/${sessId}`));
                loadHistory(); 
            } catch (e) {
                alert("Error deleting record: " + e.message);
            }
        };

        window.loadHistory = async () => {
            const container = document.getElementById('history-list');
            container.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>';
            try {
                const snapshot = await getDocs(query(collection(db, `users/${currentUser.uid}/classes/${currentClassId}/sessions`)));
                if (snapshot.empty) { container.innerHTML = '<div class="text-center py-8 text-slate-400">No records.</div>'; return; }
                const sessions = [];
                snapshot.forEach(doc => sessions.push({ id: doc.id, ...doc.data() }));
                sessions.sort((a, b) => b.timestamp - a.timestamp);
                
                let html = '<div class="space-y-4">';
                sessions.forEach(sess => {
                    const sid = sess.id;
                    
                    // Legacy support check
                    const getStatus = (r) => r.status !== undefined ? r.status : (sess.type === 'submission' ? r.submitted : r.present);
                    
                    const activeCount = sess.records.filter(getStatus).length;
                    const totalCount = sess.records.length;
                    
                    // Display Settings
                    const isAtt = sess.type !== 'submission'; // Default to attendance for legacy records
                    const typeLabel = isAtt ? 'Attendance' : 'Submission';
                    const countLabel = isAtt ? 'Present' : 'Submitted';
                    const colorClass = isAtt ? 'text-blue-600 bg-blue-50 border-blue-200' : 'text-green-600 bg-green-50 border-green-200';
                    const dotColorTrue = isAtt ? 'bg-blue-400' : 'bg-green-400';
                    const dotColorFalse = 'bg-red-400';
                    const userLabel = sess.label || typeLabel; // Falls back to basic label if they left it blank

                    html += `
                        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                            <div class="flex justify-between items-start">
                                <div class="overflow-hidden">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-[9px] font-bold px-2 py-0.5 rounded uppercase border ${colorClass}">${typeLabel}</span>
                                        <h4 class="font-bold text-slate-700 text-sm truncate" title="${userLabel}">${userLabel}</h4>
                                    </div>
                                    <p class="text-[10px] text-slate-400 font-medium mb-1">${sess.date}</p>
                                    <p class="text-[10px] text-slate-500 font-bold uppercase">${countLabel}: ${activeCount}/${totalCount}</p>
                                </div>
                                <div class="flex items-center gap-2 pl-2">
                                    <button onclick="toggleSessionDetails('${sid}')" class="text-slate-600 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center hover:bg-slate-100 transition-colors">
                                        <span id="btn-text-${sid}">Details</span> <i id="icon-${sid}" class="fas fa-chevron-down ml-2 transition-transform duration-300"></i>
                                    </button>
                                    <button onclick="deleteSession('${sid}')" class="text-slate-300 hover:text-red-500 transition-colors p-1.5" title="Delete record">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="details-${sid}" class="text-xs text-slate-500 max-h-0 overflow-hidden opacity-0 transition-all duration-500 ease-in-out">
                                <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    ${sess.records.map(r => `
                                        <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                            <div class="w-2 h-2 rounded-full ${getStatus(r) ? dotColorTrue : dotColorFalse}"></div>
                                            <span class="truncate ${!getStatus(r) ? 'text-red-500 font-medium' : 'text-slate-600'}">${r.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            } catch (e) { container.innerHTML = '<p class="text-red-500">Error.</p>'; }
        };

        window.toggleSessionDetails = (id) => {
            const el = document.getElementById(`details-${id}`);
            const txt = document.getElementById(`btn-text-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (!el) return;
            const open = el.classList.contains('details-expanded');
            if (open) { el.classList.remove('details-expanded'); if(txt) txt.innerText = 'Details'; if(icon) icon.style.transform = 'rotate(0)'; }
            else { el.classList.add('details-expanded'); if(txt) txt.innerText = 'Hide'; if(icon) icon.style.transform = 'rotate(180deg)'; }
        };

        window.addStudent = () => {
